# Production stack for the Lightsail instance.
#
# Images are built in GitHub Actions and pushed to GHCR; this file only pulls
# and runs them:  IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d
#
# To build on the box by hand (rare — emergency only), add the build override:
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
#
# Databases are NOT here — they live on Azure MySQL + MongoDB Atlas (managed).
#
#   proxy (nginx, port 80)  ->  landing:80 (serveloco.app, www.serveloco.app)
#                           ->  api:3000    (api.serveloco.app)
#                           ->  admin:80    (admin.serveloco.app)
#
# HTTPS is provided by Cloudflare in front of port 80.

services:
  api:
    # IMAGE_TAG is the deployed commit SHA, exported by the deploy workflow.
    # `latest` is only a fallback for a manual `up` with no tag in the env.
    image: ghcr.io/serveloco/projectserveloco-api:${IMAGE_TAG:-latest}
    # Inject all secrets/config at runtime (file is NOT baked into the image).
    env_file:
      - ./apps/api/.env.production
    # Firebase Admin key for phone-login token verification. It is git-ignored,
    # so it is not in the CI-built image — it lives on this box and is mounted
    # in. src/config/firebase.js reads it from /usr/src/app. The deploy fails
    # early if it is missing (otherwise Docker would create a directory here).
    volumes:
      - ./apps/api/firebase-service-account.json:/usr/src/app/firebase-service-account.json:ro
    # Ties every Sentry error from this container to the exact commit that's
    # running, so an issue can be traced straight to its deploy. Overrides
    # any SENTRY_RELEASE in .env.production (there shouldn't be one).
    environment:
      SENTRY_RELEASE: ${IMAGE_TAG:-latest}
    restart: always
    expose:
      - "3000"
    # /health reports 200 only when both MySQL and Mongo answer. start_period
    # is generous because the container runs migrate.js before it listens.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  admin:
    image: ghcr.io/serveloco/projectserveloco-admin:${IMAGE_TAG:-latest}
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  landing:
    image: ghcr.io/serveloco/projectserveloco-landing:${IMAGE_TAG:-latest}
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    # Deliberately NOT service_healthy: a sick API must not also take the
    # landing page and admin panel offline. The deploy workflow gates on
    # /health itself and rolls back.
    depends_on:
      - api
      - admin
      - landing
