server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache logos, icons and the QR code for a week (not forever, so a new
    # logo reaches people without renaming the files).
    location ~* \.(png|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Serve the landing page, and /get/ (the QR code's store redirect).
    location / {
        try_files $uri $uri/ =404;
    }

    # Compress responses for slow Indian 4G.
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;
}
