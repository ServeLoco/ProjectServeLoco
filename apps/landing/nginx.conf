server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # /privacy -> /privacy/ as a relative redirect. An absolute one would say
    # http://, because TLS ends at the proxy in front of this container.
    absolute_redirect off;

    # Basic hardening for every page. nginx drops these inside a location that
    # sets its own add_header, so the locations below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache logos, icons, fonts, the QR code and the versioned css/js for a
    # week (not forever, so a new logo reaches people without renaming files;
    # css/js links carry ?v= so a release busts them straight away).
    location ~* \.(png|svg|webp|woff2|css|js|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Serve the website pages, and /get/ (the QR code's store redirect).
    location / {
        try_files $uri $uri/ =404;
    }

    # Compress responses for slow Indian 4G.
    gzip on;
    gzip_types text/html text/css text/plain text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 256;
}
