<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="robots" content="noindex">
  <title>Get VillKro</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // Opened from the QR code: send each phone straight to its store.
    (function () {
      var ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) location.replace('https://apps.apple.com/in/app/villkro-smart-food-delivery/id6800449391');
      else if (/Android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.yashsiwach.villkro');
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B0B0C; color: #F5F5F7; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 24px; margin: 0 auto 20px; display: block; box-shadow: 0 16px 40px rgba(255,106,0,0.3); }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #A1A1AA; margin: 0 0 28px; }
    a { display: block; margin: 0 auto 12px; max-width: 280px; padding: 14px 20px; border-radius: 14px; font-weight: 700; text-decoration: none;
      background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.14); }
    a.play { background: linear-gradient(100deg, #FFD60A, #FF9F0A 35%, #FF6A00 65%, #FF3B1F); color: #150A00; border: 0; }
    a.home { background: none; border: 0; color: #A1A1AA; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="VillKro logo">
    <h1>Get VillKro</h1>
    <p>Choose your phone's app store.</p>
    <a class="play" href="https://play.google.com/store/apps/details?id=com.yashsiwach.villkro">Google Play (Android)</a>
    <a href="https://apps.apple.com/in/app/villkro-smart-food-delivery/id6800449391">App Store (iPhone)</a>
    <a class="home" href="/">Back to serveloco.app</a>
  </main>
</body>
</html>
