name: Play Store (VillKro customer app)

# Triggered only when the customer app changes AND only on main. Each run
# either starts a Play Store build (EAS auto-submits it) or publishes an OTA to
# our xprem server — .github/scripts/customer-app-release.js decides which from
# app.json's version numbers and the builds that already exist on EAS, and
# stops the run with a plain-English error when either would be unsafe.
on:
  push:
    branches: ["main"]
    paths:
      - "apps/customer-app/**"
      - ".github/workflows/playstore.yml"
      - ".github/scripts/customer-app-release.js"
  workflow_dispatch:
    inputs:
      retry_failed_build:
        description: "Start the store build again after a failed one"
        type: boolean
        default: false

# Cancel in-progress runs for the same branch on a new push.
concurrency:
  group: playstore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: apps/customer-app
  EAS_PROJECT_ID: 1df5a9bf-de34-48ea-96f4-68f598d7d318
  EAS_BUILD_NO_EXPO_GO_WARNING: "true"

jobs:
  # ── 1. CI gate: lint + tests must pass before we build or update. ───────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v5
      # The old "never use the GitHub npm cache" rule was a self-hosted concern:
      # that machine kept its own ~/.npm between jobs, so the remote cache was
      # pure download cost. A hosted runner starts empty every time, so the
      # cache is now the thing that makes npm ci fast. Scoped to the app's own
      # lockfile — the repo root has no package.json.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci

  # ── 2. Store build or OTA. ──────────────────────────────────────────────────
  release:
    name: Release (store build or OTA)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: when EAS has no fingerprint for a build, the release
          # script diffs native paths against that build's commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Configure git for EAS
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      # Replaces the old detect-bump job, which looked only at HEAD~1..HEAD
      # (so a native change earlier in a multi-commit push went out as an OTA),
      # missed patches/, plugins/ and icons, and forced a store build on any
      # feat: commit even though autoIncrement is off and the number was
      # already used. See the script header for the rules.
      - name: Decide store build or OTA
        id: decide
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RETRY_FAILED_BUILD: ${{ inputs.retry_failed_build }}
        run: node ../../.github/scripts/customer-app-release.js android

      # ─── STORE BUILD: EAS cloud build + Play Store submit ─────────────────
      # Build runs on EAS's own infra, this runner only orchestrates.
      # EXPO_PUBLIC_* vars must be set as EAS environment variables/secrets on
      # the project — job-level env below does NOT reach a cloud build.
      #
      # --auto-submit --no-wait: EAS submits to Play itself once the build
      # finishes, so this runner exits as soon as the build is queued instead
      # of sitting idle for the whole EAS queue + build (16–88 min a run, all
      # of it billed as Actions minutes once the repo is private). eas-cli
      # creates the submission before it returns and reads
      # /tmp/play-store-key.json (eas.json serviceAccountKeyPath) at that
      # moment, sending its contents along — so deleting the file afterwards
      # is fine. A build that fails on EAS makes the next run of this workflow
      # stop with a red error that links to it; check expo.dev for the submit.
      - name: Materialize Play Store service account key
        if: steps.decide.outputs.decision == 'build'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-store-key.json

      - name: Build Android .aab on EAS cloud and auto-submit to Google Play
        if: steps.decide.outputs.decision == 'build'
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform android --profile production --non-interactive \
            --auto-submit --no-wait

      # ─── OTA: no store build needed, just publish the JS ──────────────────
      # Only when the script found a store build for the current numbers and
      # the native fingerprint still matches every store build on this
      # runtimeVersion (Android and iOS — one OTA serves both). A store build
      # run ships its JS inside the binary; there is nothing here to push.
      #
      # OTA updates are served by our own xprem server (ota.serveloco.app), not
      # EAS Update — EAS's free tier only reaches 1,000 users a month. Builds
      # and store submits above stay on EAS. Apps from 1.9.6 on ask xprem
      # (app.json updates.url); older binaries still ask EAS and get no new
      # OTAs until they update from the store.
      - name: Publish OTA update to xprem (production channel)
        if: steps.decide.outputs.decision == 'ota'
        working-directory: ${{ env.APP_DIR }}
        env:
          # App-scoped API token from the xprem dashboard (API tokens page).
          # Without it eoas silently falls back to Expo auth and the server
          # rejects the publish, so fail with a clear message instead.
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          RELEASE_CHANNEL: production
          EXPO_PUBLIC_API_BASE_URL: https://api.villkro.in/api
          EXPO_PUBLIC_MAPBOX_PUBLIC_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_PUBLIC_TOKEN }}
          OTA_MESSAGE: ${{ steps.decide.outputs.ota_message }}
        run: |
          set -euo pipefail
          if [ -z "$EOO_TOKEN" ]; then
            echo "::error::EOO_TOKEN secret is empty — create an API token in the xprem dashboard (https://ota.serveloco.app/dashboard) and add it as a repo secret"
            exit 1
          fi
          MSG=$(printf '%s' "$OTA_MESSAGE" | head -1)
          if [ -z "$MSG" ]; then MSG="auto-update from main"; fi
          # Pinned to the server's version (docker-compose.prod.yml, service
          # `ota`): a server on v3.2+ refuses a publish from another CLI version.
          npx --yes eoas@3.2.5 publish --branch production --message "$MSG" \
            --nonInteractive --disableRepositoryCheck

      - name: Clean up service account key
        if: always()
        run: rm -f /tmp/play-store-key.json

