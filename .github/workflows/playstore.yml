name: Play Store (VillKro customer app)

# Triggered only when the customer app changes AND only on main.
# Manual trigger is available for emergency rebuilds.
on:
  push:
    branches: ["main"]
    paths:
      - "apps/customer-app/**"
      - ".github/workflows/playstore.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same branch on a new push.
concurrency:
  group: playstore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_DIR: apps/customer-app
  EAS_PROJECT_ID: 1df5a9bf-de34-48ea-96f4-68f598d7d318
  EAS_BUILD_NO_EXPO_GO_WARNING: "true"

jobs:
  # ── 1. CI gate: lint + tests must pass before we build or update. ───────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v5
      # The old "never use the GitHub npm cache" rule was a self-hosted concern:
      # that machine kept its own ~/.npm between jobs, so the remote cache was
      # pure download cost. A hosted runner starts empty every time, so the
      # cache is now the thing that makes npm ci fast. Scoped to the app's own
      # lockfile — the repo root has no package.json.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci

  # ── 2. Decide whether this merge is a major (native changed) or minor. ─────
  detect-bump:
    name: Detect bump (major vs minor)
    runs-on: ubuntu-latest
    needs: ci
    env:
      FORCE_MAJOR: ${{ vars.FORCE_MAJOR }}
    outputs:
      bump: ${{ steps.decide.outputs.bump }}
      message: ${{ steps.decide.outputs.message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Determine baseline range (HEAD~1..HEAD)
        id: baseline
        run: |
          set -euo pipefail
          # Compare this commit against its immediate parent. The bump detector
          # decides major/minor from this single-commit delta.
          RANGE="HEAD~1..HEAD"
          echo "Comparing $RANGE"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Read commit messages in range
        id: msgs
        run: |
          set -euo pipefail
          MSGS="$(git log --pretty=format:'%s' ${{ steps.baseline.outputs.range }} | head -20 || true)"
          {
            echo "msgs<<EOF"
            echo "$MSGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check if customer-app package.json changed
        id: pkg
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only ${{ steps.baseline.outputs.range }} -- ${{ env.APP_DIR }}/package.json || true)"
          echo "package.json changed files: $CHANGED"
          if [ -n "$CHANGED" ]; then
            echo "pkg_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide bump type
        id: decide
        env:
          MSGS: ${{ steps.msgs.outputs.msgs }}
          PKG_CHANGED: ${{ steps.pkg.outputs.pkg_changed }}
        run: |
          set -euo pipefail

          BUMP="minor"
          REASON="no native dep change detected"

          # Override: set the repo variable FORCE_MAJOR=true to force a major build.
          if [ "${FORCE_MAJOR:-false}" = "true" ]; then
            BUMP="major"
            REASON="FORCE_MAJOR=true set on the repo"
          fi

          # The first-deploy bootstrap that used to sit here is gone. It keyed
          # off a marker file under /home/linux-server/Documents/builds/, which
          # only ever meant anything while this job ran on one specific machine.
          # A hosted runner starts empty: the mkdir would fail outright under
          # set -e, and if it somehow did not, the marker would be missing on
          # every run and force every release to major — no OTA would ship
          # again. Its purpose is served anyway; both stores have had a binary
          # since 1.8.x. To force a rebuild now, set the repo variable
          # FORCE_MAJOR=true (handled above).

          if [ "$PKG_CHANGED" = "true" ]; then
            BUMP="major"
            REASON="package.json changed in apps/customer-app"
          fi
          if echo "$MSGS" | grep -Eqi '^(feat|breaking)(\(.+\))?!?:'; then
            BUMP="major"
            REASON="commit prefix is feat: or BREAKING"
          fi

          echo "Decision: $BUMP ($REASON)"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          # Use heredoc to safely write multi-line commit messages with
          # special characters (parens, colons) to GITHUB_OUTPUT.
          {
            echo "message<<EOF"
            echo "$MSGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── 3. Build (EAS cloud) + Submit + Update. ─────────────────────────────────
  build-submit-update:
    name: Build / Submit / Update
    runs-on: ubuntu-latest
    needs: detect-bump
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Materialize Play Store service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-store-key.json
          ls -la /tmp/play-store-key.json

      - name: Verify EAS authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # Debug: show PATH and eas location
          echo "=== Diagnostics ==="
          echo "PATH=$PATH"
          echo "eas location: $(which eas 2>&1 || echo 'NOT FOUND')"
          echo "eas version: $(eas --version 2>&1 || echo 'CANNOT RUN')"
          echo "node version: $(node --version)"
          echo "npm prefix -g: $(npm prefix -g 2>&1 || echo 'CANNOT')"
          echo "=== End diagnostics ==="
          # With EXPO_TOKEN env var set, EAS CLI authenticates automatically.
          eas whoami 2>&1 || echo "eas whoami failed"

      - name: Configure git for EAS
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      # ─── MAJOR PATH: EAS cloud build + Play Store submit + OTA ─────────────
      # Mirrors appstore.yml: build runs on EAS's own infra, this runner only
      # orchestrates. EXPO_PUBLIC_* vars must be set as EAS environment
      # variables/secrets on the project — job-level env below does NOT reach
      # a cloud build (it only ever reached the old `--local` build).
      - name: Build Android .aab on EAS cloud
        if: needs.detect-bump.outputs.bump == 'major'
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform android --profile production --non-interactive --wait

      - name: Submit .aab to Google Play (Production track)
        if: needs.detect-bump.outputs.bump == 'major'
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas submit --platform android --latest --non-interactive
          echo "✓ Submit succeeded"

      # ─── Persist the version EAS actually used ─────────────────────────────
      # autoIncrement bumps the version inside EAS's cloud checkout, which
      # never comes back here — so app.json kept proposing a number Google
      # Play already had and every release died on "You've already submitted
      # this version" (burned 37, burned 39). Read what the finished build
      # used and write it back. [skip ci] so this bookkeeping commit does not
      # re-trigger the whole pipeline.
      - name: Persist the version EAS used
        if: needs.detect-bump.outputs.bump == 'major'
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          CODE=$(eas build:list --platform android --limit 1 --status finished --json --non-interactive \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const b=JSON.parse(s)[0];process.stdout.write(String(b.appBuildVersion||''))}catch(e){process.stdout.write('')}})")
          if [ -z "$CODE" ]; then
            echo "::warning::could not read the build version from EAS — versionCode left as-is"
            exit 0
          fi
          CODE="$CODE" node -e "
            const fs=require('fs');
            const p='app.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.expo.android.versionCode = Number(process.env.CODE);
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "
          if git diff --quiet -- app.json; then
            echo "app.json already records $CODE — nothing to persist"
            exit 0
          fi
          git add app.json
          git commit -m "chore: record android versionCode $CODE used by EAS [skip ci]"
          git push origin HEAD:main || {
            echo "::warning::could not push the version bump back to main (branch protection?) — app.json still says the old value, next release will collide"
            exit 0
          }

      # ─── MINOR PATH: skip the build, just publish the OTA ──────────────────
      # Minor ONLY. An OTA is JS with no native side, so publishing one on a
      # major release hands every phone already on the old binary a bundle
      # whose native modules it does not have — and it arrives within seconds,
      # long before the Play rollout it belongs to. A major release ships its
      # JS inside the .aab; there is nothing here left to push.
      - name: Publish EAS Update (production channel)
        if: needs.detect-bump.outputs.bump == 'minor'
        working-directory: ${{ env.APP_DIR }}
        env:
          # Without this the minor (OTA) path stops with "An Expo user account is
          # required" — the token was only set on the build/submit steps.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAPBOX_PUBLIC_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_PUBLIC_TOKEN }}
          BUMP_MESSAGE: ${{ needs.detect-bump.outputs.message }}
        run: |
          set -euo pipefail
          MSG=$(printf '%s' "$BUMP_MESSAGE" | head -1)
          if [ -z "$MSG" ]; then MSG="auto-update from main"; fi
          eas update --branch production --message "$MSG" --non-interactive

      - name: Clean up service account key
        if: always()
        run: rm -f /tmp/play-store-key.json

