name: Landing CI

on:
  pull_request:
    branches: [main]
    paths: ['apps/landing/**', '.github/workflows/ci-landing.yml']
  push:
    branches: [main]
    paths: ['apps/landing/**', '.github/workflows/ci-landing.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the generated pages are up to date
        run: |
          python -m pip install --quiet jinja2==3.1.6
          python apps/landing/build/build.py --check
      - name: Build the production website
        run: docker build -t villkro-landing-ci apps/landing
      - name: Start and validate nginx
        run: |
          docker run -d --name landing-ci -p 127.0.0.1:8080:80 villkro-landing-ci
          docker exec landing-ci nginx -t
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs landing-ci
          exit 1
      - name: Check public pages and crawler responses
        shell: python
        run: |
          import json
          from html.parser import HTMLParser
          from urllib.error import HTTPError
          from urllib.request import urlopen
          import xml.etree.ElementTree as ET

          base = 'http://127.0.0.1:8080'
          def fetch(path):
              with urlopen(base + path, timeout=10) as response:
                  assert response.status == 200, path
                  return response.read(), response.headers
          def get(path):
              return fetch(path)[0].decode()

          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonical, self.robots, self.schemas, self.links = [], [], [], []
                  self.alternates = {}
                  self.h1, self.in_schema = 0, False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'h1': self.h1 += 1
                  if tag == 'link' and attrs.get('rel') == 'canonical':
                      self.canonical.append(attrs.get('href'))
                  if tag == 'link' and attrs.get('rel') == 'alternate' and attrs.get('hreflang'):
                      self.alternates[attrs['hreflang']] = attrs.get('href')
                  if tag == 'meta' and attrs.get('name') == 'robots':
                      self.robots.append(attrs.get('content', '').lower())
                  if tag == 'script' and attrs.get('type') == 'application/ld+json':
                      self.in_schema = True
                      self.schemas.append('')
                  for key in ('href', 'src'):
                      value = attrs.get(key) or ''
                      if value.startswith('/') and not value.startswith('//'):
                          self.links.append(value.split('#')[0].split('?')[0])
              def handle_data(self, data):
                  if self.in_schema: self.schemas[-1] += data
              def handle_endtag(self, tag):
                  if tag == 'script': self.in_schema = False

          towns = ['/delivery/gorakhpur-haryana/', '/delivery/agroha-haryana/']
          sitemap = ET.fromstring(get('/sitemap.xml'))
          urls = [node.text for node in sitemap.findall('{*}url/{*}loc')]
          must = {'/', '/app/', '/about/', '/sell-on-villkro/', '/deliver-with-villkro/', '/hi/'} | set(towns)
          assert must <= {u.removeprefix('https://villkro.in') for u in urls}, 'core pages missing from sitemap'
          assert len(urls) == len(set(urls)) and len(urls) >= 20, len(urls)
          internal, alternates = set(), {}
          for url in urls:
              path = url.removeprefix('https://villkro.in')
              html = get(path)
              page = Metadata()
              page.feed(html)
              assert page.h1 == 1 and page.canonical == [url], url
              assert all('noindex' not in value for value in page.robots), url
              assert page.schemas, url
              for schema in page.schemas: json.loads(schema)
              for town in towns:
                  assert town in html, (url, town)
              assert ('<html lang="hi">' in html) == path.startswith('/hi/'), url
              assert 'sizes="192x192" href="/icon.png"' in html, url
              assert '<meta name="apple-itunes-app" content="app-id=6800449391">' in html, url
              assert 'href="/assets/site.css' in html and 'href="/site.webmanifest"' in html, url
              assert 'com.yashsiwach.villkro' in html and 'id6800449391' in html, url
              alternates[url] = page.alternates
              internal.update(page.links)

          # Hindi and English twins must point at each other.
          for url, alts in alternates.items():
              if not alts: continue
              assert url in alts.values() and 'x-default' in alts, url
              for lang, other in alts.items():
                  assert alternates.get(other) == alts, (url, lang, other)

          helper = Metadata()
          helper.feed(get('/get/'))
          assert any('noindex' in value for value in helper.robots)
          internal.update(helper.links)
          assert 'Sitemap: https://villkro.in/sitemap.xml' in get('/robots.txt')

          # Every root-relative link and asset on the pages must resolve.
          internal.discard('/')
          for asset in sorted(internal | {'/logo.png', '/icon.png', '/og-image.png', '/qr-download.svg', '/favicon-32.png', '/assets/media/hero-wide.mp4', '/assets/media/hero-tall.mp4'}):
              body, _ = fetch(asset)
              assert body, asset

          manifest, headers = fetch('/site.webmanifest')
          assert headers.get('Content-Type', '').startswith('application/manifest+json'), headers.get('Content-Type')
          assert json.loads(manifest)['related_applications']
          for path in ['/', '/assets/site.css']:
              _, headers = fetch(path)
              assert headers.get('X-Content-Type-Options') == 'nosniff', path
          _, headers = fetch('/assets/fonts/jakarta-latin.woff2')
          assert 'max-age=' in headers.get('Cache-Control', ''), headers
          try:
              get('/this-page-does-not-exist')
              raise AssertionError('Missing page must return 404')
          except HTTPError as error:
              assert error.code == 404
          print(f'{len(urls)} pages: canonical, schema, hreflang, sitemap, links, assets, headers, download helper and 404 passed')
      - name: Clean up
        if: always()
        run: docker rm -f landing-ci || true
