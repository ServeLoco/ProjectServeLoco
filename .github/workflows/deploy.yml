name: Deploy to AWS Lightsail

# Triggered only on push to main (not on PRs)
on:
  push:
    branches: [ "main" ]
    # The server stack has nothing to do with a customer-app release or a docs
    # edit. Skipping those pushes matters more now that images are tagged per
    # commit: a new tag makes compose recreate containers whose contents did
    # not change. A push that touches these AND anything else still deploys.
    paths-ignore:
      - 'apps/customer-app/**'
      - 'plans/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Two merges close together used to deploy over each other. Queue them instead;
# never cancel, because a cancelled run can leave the box half-deployed.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/serveloco/projectserveloco

jobs:
  # ── Run all CI checks first ──────────────────────────────────────────────────
  ci-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: serveloco_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './apps/api/package-lock.json'
      - run: npm ci
      - run: npm run lint
      # The deploy now runs migrate.js against production as its own step, so
      # proving it boots and is idempotent belongs in the gate ahead of it —
      # the same two passes ci.yml does. Every test mocks src/db/mysql, so this
      # is the only thing that exercises the real migration.
      - name: Run DB migration (first pass)
        run: npm run db:migrate
        env: &migrate_env
          NODE_ENV: development
          JWT_SECRET: ci_jwt_secret_that_is_long_enough
          ADMIN_OWNER_ID: ci_admin
          ADMIN_PASSWORD: ci_test_password_123
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: serveloco_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_SSL: false
          MONGODB_URI: mongodb://localhost:27017/
          MONGODB_DATABASE: serveloco_images_test
      - name: Run DB migration (second pass — must be idempotent)
        run: npm run db:migrate
        env: *migrate_env
      - run: npm test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: serveloco_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_SSL: false
          MONGODB_URI: mongodb://localhost:27017/
          MONGODB_DATABASE: serveloco_images_test

  ci-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './apps/admin/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ci-customer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/customer-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './apps/customer-app/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Build the images HERE, not on the production box ─────────────────────────
  # Building on Lightsail meant every deploy spent the outage compiling while
  # competing with nothing (the stack was already down). GitHub runners build
  # the three images in parallel and push them to GHCR tagged with the commit
  # SHA; the box only pulls. The SHA tag is also what makes rollback possible.
  build-images:
    runs-on: ubuntu-latest
    needs: [ci-api, ci-admin, ci-customer-app]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            context: ./apps/api
            build_args: ""
          - app: admin
            context: ./apps/admin
            # Vite inlines this at build time — must be the public API URL.
            build_args: VITE_API_BASE_URL=https://api.serveloco.app/api
          - app: landing
            context: ./apps/landing
            build_args: ""
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ── Deploy ONLY after every image is built and pushed ────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Deploy via SSH to AWS Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset until the backup bucket exists; the upload skips itself and
          # warns rather than failing the deploy. This key is separate from the
          # API's image-upload credentials in apps/api/.env.production on
          # purpose: it needs PutObject and nothing else, and it is passed in
          # for the length of this SSH session instead of living on the box.
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,BACKUP_S3_BUCKET,BACKUP_S3_PREFIX,BACKUP_S3_REGION,BACKUP_AWS_ACCESS_KEY_ID,BACKUP_AWS_SECRET_ACCESS_KEY
          script_stop: true
          script: |
            set -eo pipefail
            cd ~/ProjectServeLoco
            git fetch origin
            # Treat the server as a pure deployment mirror of origin/main.
            # Any local commits or uncommitted changes on the server's main are
            # discarded automatically. This prevents silent deploy stalls when
            # someone hotfixes directly on the server and those commits never get
            # pushed back to GitHub. If you need to keep server-side hotfixes,
            # push them to GitHub first or they will be overwritten on deploy.
            git reset --hard origin/main

            # The job's own token, valid only while this run lasts — no
            # long-lived registry credential is stored on the box.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Written at the end of the last SUCCESSFUL deploy. Empty on the
            # first run of this workflow, which simply means no auto-rollback.
            PREV_TAG="$(cat .deploy-tag 2>/dev/null || true)"

            rollback_and_fail() {
              echo "::error::$1"
              if [ -n "$PREV_TAG" ]; then
                echo "Rolling back to $PREV_TAG"
                IMAGE_TAG="$PREV_TAG" docker compose -f docker-compose.prod.yml up -d --remove-orphans
              else
                # Nothing to roll back to, but the api container may have been
                # stopped for the migration — it still holds the old image.
                echo "No previous tag recorded — restarting whatever was running."
                docker compose -f docker-compose.prod.yml start api || true
              fi
              docker logout ghcr.io || true
              exit 1
            }

            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull

            # ── Back up MySQL before anything can touch the schema ──────────
            # The old API is still serving at this point, so a failure here
            # costs nothing but the deploy. Keep the four newest dumps; this
            # one makes five.
            mkdir -p "$HOME/backups"
            (ls -1t "$HOME"/backups/serveloco_*.sql.gz 2>/dev/null || true) | tail -n +5 | xargs -r rm -f
            (ls -1t "$HOME"/backups/serveloco_*.mongo.gz 2>/dev/null || true) | tail -n +5 | xargs -r rm -f
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)_$(echo "$IMAGE_TAG" | cut -c1-7)"
            DUMP="$HOME/backups/serveloco_$STAMP.sql.gz"
            MONGO_DUMP="$HOME/backups/serveloco_$STAMP.mongo.gz"

            # --env-file keeps the credentials inside the container; MYSQL_PWD
            # keeps the password out of the process list.
            if ! docker run --rm --env-file ./apps/api/.env.production mysql:8.0 sh -c '
                   export MYSQL_PWD="$MYSQL_PASSWORD"
                   exec mysqldump -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$MYSQL_USER" \
                     --ssl-mode=REQUIRED --single-transaction --quick \
                     --routines --triggers --events --default-character-set=utf8mb4 \
                     "$MYSQL_DATABASE"
                 ' | gzip > "$DUMP"; then
              rm -f "$DUMP"
              docker logout ghcr.io || true
              echo "::error::mysqldump failed — nothing was deployed and the schema is untouched"
              exit 1
            fi

            gzip -t "$DUMP"
            DUMP_BYTES="$(stat -c%s "$DUMP")"
            if [ "$DUMP_BYTES" -lt 10240 ]; then
              docker logout ghcr.io || true
              echo "::error::backup is only $DUMP_BYTES bytes — refusing to migrate. Kept at $DUMP"
              exit 1
            fi
            echo "Backup written: $DUMP ($DUMP_BYTES bytes)"

            # ── Back up Mongo ───────────────────────────────────────────────
            # Deliberately NOT a deploy gate. The deploy is gated on what the
            # deploy can destroy, and migrate.js touches MySQL only; failing
            # the release over the image-metadata dump would trade an outage
            # for a backup this deploy cannot harm. The scheduled restore
            # verification is what notices if these stop arriving.
            if ! ./deploy/backup/dump-mongo.sh "$MONGO_DUMP"; then
              echo "::warning::Mongo backup failed — continuing, MySQL is backed up and is what migrates"
              MONGO_DUMP=""
            fi

            # ── Copy the backups off this box ───────────────────────────────
            # $HOME/backups is on the same disk as the thing it protects.
            # A no-op until BACKUP_S3_BUCKET is set, and never a deploy gate:
            # the local dump above has already done its job of making the
            # migration reversible.
            if ! ./deploy/backup/offbox-upload.sh "$DUMP" ${MONGO_DUMP:+"$MONGO_DUMP"}; then
              echo "::warning::off-box upload failed — backups for this deploy exist only on this box"
            fi

            # ── Migrate with the API stopped ────────────────────────────────
            # Old code must never run against the new schema, so the API goes
            # down before the DDL and comes back on the new image after it.
            # Landing, admin and the proxy keep serving throughout.
            docker compose -f docker-compose.prod.yml stop api
            if ! docker compose -f docker-compose.prod.yml run --rm --no-deps api npm run db:migrate; then
              echo "The schema may be partially migrated. Backup for a manual restore: $DUMP"
              rollback_and_fail "migration failed for $IMAGE_TAG"
            fi

            # No `down` and no --force-recreate: compose restarts only the
            # services whose image tag actually changed, so landing/admin stay
            # up when just the API moves.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # A bind-mounted config change does not recreate the proxy, and the
            # proxy is also the container that has to notice a recreated API's
            # new IP. Validate the config, then reload it in place.
            docker compose -f docker-compose.prod.yml exec -T proxy nginx -t \
              || rollback_and_fail "nginx config failed validation — proxy not reloaded"
            docker compose -f docker-compose.prod.yml exec -T proxy nginx -s reload \
              || rollback_and_fail "nginx reload failed"

            # Gate on the real thing a customer hits: /health through the proxy,
            # which is 200 only when both MySQL and Mongo answer.
            ok=0
            for _ in $(seq 1 36); do
              if curl -fsS -m 5 -H 'Host: api.serveloco.app' http://localhost/health >/dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            [ "$ok" = "1" ] || rollback_and_fail "API failed /health after deploy of $IMAGE_TAG"

            echo "$IMAGE_TAG" > .deploy-tag
            # Old SHA-tagged layers accumulate fast on a small Lightsail disk.
            docker image prune -f
            docker logout ghcr.io || true
            echo "Deployed $IMAGE_TAG"
