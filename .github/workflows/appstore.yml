name: App Store (VillKro customer app)

# Mirrors playstore.yml. Both stores build on EAS cloud infrastructure — iOS
# has no choice (Xcode requires macOS) and Android is set up the same way — so
# the runner here never compiles anything. It installs deps, runs the suite,
# and drives the EAS API. That is why it no longer asks for a self-hosted
# machine: nothing in this file needs one.
#
# OTA updates are deliberately NOT published here. The OTA publish
# (`eoas publish` to our xprem server, ota.serveloco.app) is
# platform-agnostic — playstore.yml already publishes to the `production`
# branch on every push to main, and that update serves iOS and Android alike.
# Publishing from both workflows would create duplicate updates for the same
# commit. This workflow therefore only acts on a MAJOR bump (native rebuild).
on:
  push:
    branches: ["main"]
    paths:
      - "apps/customer-app/**"
      - ".github/workflows/appstore.yml"
  workflow_dispatch:

concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_DIR: apps/customer-app
  EAS_PROJECT_ID: 1df5a9bf-de34-48ea-96f4-68f598d7d318
  EAS_BUILD_NO_EXPO_GO_WARNING: "true"

jobs:
  # ── 1. CI gate: lint + tests must pass before we build or submit. ──────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci

  # ── 2. Decide whether this merge needs a native rebuild. ──────────────────
  # Same rules as playstore.yml so both stores stay in lockstep.
  detect-bump:
    name: Detect bump (major vs minor)
    runs-on: ubuntu-latest
    needs: ci
    env:
      FORCE_MAJOR: ${{ vars.FORCE_MAJOR }}
    outputs:
      bump: ${{ steps.decide.outputs.bump }}
      message: ${{ steps.decide.outputs.message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Determine baseline range (HEAD~1..HEAD)
        id: baseline
        run: |
          set -euo pipefail
          RANGE="HEAD~1..HEAD"
          echo "Comparing $RANGE"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Read commit messages in range
        id: msgs
        run: |
          set -euo pipefail
          MSGS="$(git log --pretty=format:'%s' ${{ steps.baseline.outputs.range }} | head -20 || true)"
          {
            echo "msgs<<EOF"
            echo "$MSGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check if customer-app package.json changed
        id: pkg
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only ${{ steps.baseline.outputs.range }} -- ${{ env.APP_DIR }}/package.json || true)"
          echo "package.json changed files: $CHANGED"
          if [ -n "$CHANGED" ]; then
            echo "pkg_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide bump type
        id: decide
        env:
          MSGS: ${{ steps.msgs.outputs.msgs }}
          PKG_CHANGED: ${{ steps.pkg.outputs.pkg_changed }}
        run: |
          set -euo pipefail

          BUMP="minor"
          REASON="no native dep change detected"

          if [ "${FORCE_MAJOR:-false}" = "true" ]; then
            BUMP="major"
            REASON="FORCE_MAJOR=true set on the repo"
          fi

          # The iOS first-deploy marker is gone for the same reason as the
          # Android one in playstore.yml: it lived on one machine's disk, and a
          # hosted runner has no such disk. See that file for the full note.

          if [ "$PKG_CHANGED" = "true" ]; then
            BUMP="major"
            REASON="package.json changed in apps/customer-app"
          fi
          if echo "$MSGS" | grep -Eqi '^(feat|breaking)(\(.+\))?!?:'; then
            BUMP="major"
            REASON="commit prefix is feat: or BREAKING"
          fi

          echo "Decision: $BUMP ($REASON)"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "$MSGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── 3. Cloud build + App Store submit (major bumps only). ─────────────────
  build-submit:
    name: Build / Submit (EAS cloud)
    runs-on: ubuntu-latest
    needs: detect-bump
    if: needs.detect-bump.outputs.bump == 'major'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # "Persist the version EAS used" below runs `git commit`. On the old
      # self-hosted box that worked by accident, off a global ~/.gitconfig some
      # human had set up long ago. A hosted runner has no identity, so the
      # commit would abort with "Author identity unknown" AFTER the build and
      # the App Store upload had already succeeded — a green release reported
      # as a failure. playstore.yml has always configured git here; this file
      # never did, and only got away with it because of that machine.
      - name: Configure git for EAS
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      - name: Verify EAS authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas whoami

      # The build itself runs on EAS macOS infrastructure. Credentials
      # (distribution cert, provisioning profile) are managed remotely, so no
      # Apple secrets are needed for this step — only for the submit below.
      - name: Build iOS .ipa on EAS cloud
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive --wait

      - name: Materialize App Store Connect API key
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ASC_API_KEY_P8" ]; then
            echo "APPLE_ASC_API_KEY_P8 secret is empty" >&2
            exit 1
          fi
          printf '%s' "$APPLE_ASC_API_KEY_P8" > /tmp/asc-api-key.p8

      - name: Submit to App Store Connect
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # ascAppId and appleTeamId live in eas.json (neither is secret).
          # Auth is via an App Store Connect API key rather than the Apple ID
          # + app-specific password — that pair is tied to a personal Apple ID
          # session and silently breaks (no revocation, just stops working)
          # independent of the password's own validity. The API key has no
          # such failure mode. EAS reads these three exact variable names —
          # renaming them silently breaks the upload.
          EXPO_ASC_API_KEY_PATH: /tmp/asc-api-key.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Submits the build produced above. This uploads to App Store
          # Connect only; it does NOT release to users. Submitting for review
          # and releasing stay manual in App Store Connect.
          eas submit --platform ios --latest --non-interactive

      # ─── Persist the version EAS actually used ─────────────────────────────
      # autoIncrement bumps the version inside EAS's cloud checkout, which
      # never comes back here — so app.json kept proposing a number Google
      # Play already had and every release died on "You've already submitted
      # this version" (burned 37, burned 39). Read what the finished build
      # used and write it back. [skip ci] so this bookkeeping commit does not
      # re-trigger the whole pipeline.
      - name: Persist the version EAS used
        if: needs.detect-bump.outputs.bump == 'major'
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          CODE=$(eas build:list --platform ios --limit 1 --status finished --json --non-interactive \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const b=JSON.parse(s)[0];process.stdout.write(String(b.appBuildVersion||''))}catch(e){process.stdout.write('')}})")
          if [ -z "$CODE" ]; then
            echo "::warning::could not read the build version from EAS — buildNumber left as-is"
            exit 0
          fi
          CODE="$CODE" node -e "
            const fs=require('fs');
            const p='app.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.expo.ios.buildNumber = String(process.env.CODE);
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "
          if git diff --quiet -- app.json; then
            echo "app.json already records $CODE — nothing to persist"
            exit 0
          fi
          git add app.json
          git commit -m "chore: record ios buildNumber $CODE used by EAS [skip ci]" || {
            echo "::warning::could not commit the buildNumber — skipping the write-back"
            exit 0
          }
          git push origin HEAD:main || {
            echo "::warning::could not push the version bump back to main (branch protection?) — app.json still says the old value, next release will collide"
            exit 0
          }

      - name: Clean up App Store Connect API key
        if: always()
        run: rm -f /tmp/asc-api-key.p8
