name: App Store (VillKro customer app)

# Mirrors playstore.yml. Both stores build on EAS cloud infrastructure — iOS
# has no choice (Xcode requires macOS) and Android is set up the same way — so
# the runner here never compiles anything. It installs deps, runs the suite,
# and drives the EAS API. That is why it no longer asks for a self-hosted
# machine: nothing in this file needs one.
#
# OTA updates are deliberately NOT published here. The OTA publish
# (`eoas publish` to our xprem server) is platform-agnostic — playstore.yml
# publishes it, after checking the native fingerprint of the iOS store builds
# too, and that update serves iOS and Android alike. This workflow only starts
# an App Store build when .github/scripts/customer-app-release.js says one is
# due (new buildNumber), and otherwise reports native changes that need one.
on:
  push:
    branches: ["main"]
    paths:
      - "apps/customer-app/**"
      - ".github/workflows/appstore.yml"
      - ".github/scripts/customer-app-release.js"
  workflow_dispatch:
    inputs:
      retry_failed_build:
        description: "Start the store build again after a failed one"
        type: boolean
        default: false

concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: apps/customer-app
  EAS_PROJECT_ID: 1df5a9bf-de34-48ea-96f4-68f598d7d318
  EAS_BUILD_NO_EXPO_GO_WARNING: "true"

jobs:
  # ── 1. CI gate: lint + tests must pass before we build or submit. ──────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci

  # ── 2. App Store build when one is due. ───────────────────────────────────
  release:
    name: Release (store build)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: when EAS has no fingerprint for a build, the release
          # script diffs native paths against that build's commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Decide whether an App Store build is due
        id: decide
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RETRY_FAILED_BUILD: ${{ inputs.retry_failed_build }}
        run: node ../../.github/scripts/customer-app-release.js ios

      # The build itself runs on EAS macOS infrastructure. Credentials
      # (distribution cert, provisioning profile) are managed remotely.
      #
      # The submit authenticates with the App Store Connect API key stored on
      # EAS for com.yashsiwach.villkro (key V3ZHK6AT28; the 1.9.10 log reads
      # "Key Source: EAS servers"). eas.json's submit profile has no
      # ascApiKeyPath, so eas-cli always uses that one — the .p8 GitHub used to
      # write to /tmp, and the EXPO_ASC_API_KEY_* variables next to it, were
      # never read (eas-cli's names are EXPO_ASC_KEY_ID / EXPO_ASC_ISSUER_ID,
      # and only for credential setup). The APPLE_ASC_API_KEY_P8, ASC_KEY_ID
      # and ASC_KEY_ISSUER_ID repo secrets are unused now.
      #
      # --auto-submit --no-wait: EAS uploads to App Store Connect itself once
      # the build finishes, so this runner exits as soon as the build is
      # queued instead of sitting idle for the whole EAS queue + build (10–84
      # min a run, all of it billed as Actions minutes once the repo is
      # private). A build that fails on EAS makes the next run of this
      # workflow stop with a red error that links to it; check expo.dev for
      # the submit.
      #
      # This uploads to App Store Connect only; it does NOT release to users.
      # Submitting for review and releasing stay manual in App Store Connect.
      - name: Build iOS .ipa on EAS cloud and auto-submit to App Store Connect
        if: steps.decide.outputs.decision == 'build'
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive \
            --auto-submit --no-wait
