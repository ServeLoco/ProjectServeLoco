name: App Store (VillKro customer app)

# Mirrors playstore.yml. Both stores build on EAS cloud infrastructure — iOS
# has no choice (Xcode requires macOS) and Android is set up the same way — so
# the runner here never compiles anything. It installs deps, runs the suite,
# and drives the EAS API. That is why it no longer asks for a self-hosted
# machine: nothing in this file needs one.
#
# OTA updates are deliberately NOT published here. The OTA publish
# (`eoas publish` to our xprem server, ota.serveloco.app) is
# platform-agnostic — playstore.yml already publishes to the `production`
# branch on every push to main, and that update serves iOS and Android alike.
# Publishing from both workflows would create duplicate updates for the same
# commit. This workflow therefore only acts on a MAJOR bump (native rebuild).
on:
  push:
    branches: ["main"]
    paths:
      - "apps/customer-app/**"
      - ".github/workflows/appstore.yml"
  workflow_dispatch:

concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: apps/customer-app
  EAS_PROJECT_ID: 1df5a9bf-de34-48ea-96f4-68f598d7d318
  EAS_BUILD_NO_EXPO_GO_WARNING: "true"

jobs:
  # ── 1. CI gate: lint + tests must pass before we build or submit. ──────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci

  # ── 2. Decide whether this merge needs a native rebuild. ──────────────────
  # Same rules as playstore.yml so both stores stay in lockstep.
  detect-bump:
    name: Detect bump (major vs minor)
    runs-on: ubuntu-latest
    needs: ci
    env:
      FORCE_MAJOR: ${{ vars.FORCE_MAJOR }}
    outputs:
      bump: ${{ steps.decide.outputs.bump }}
      message: ${{ steps.decide.outputs.message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Determine baseline range (HEAD~1..HEAD)
        id: baseline
        run: |
          set -euo pipefail
          RANGE="HEAD~1..HEAD"
          echo "Comparing $RANGE"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Read commit messages in range
        id: msgs
        run: |
          set -euo pipefail
          MSGS="$(git log --pretty=format:'%s' ${{ steps.baseline.outputs.range }} | head -20 || true)"
          {
            echo "msgs<<EOF"
            echo "$MSGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check if customer-app native configuration changed
        id: pkg
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only ${{ steps.baseline.outputs.range }} -- ${{ env.APP_DIR }}/package.json ${{ env.APP_DIR }}/app.json ${{ env.APP_DIR }}/android ${{ env.APP_DIR }}/ios || true)"
          echo "Native configuration changed files: $CHANGED"
          if [ -n "$CHANGED" ]; then
            echo "pkg_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide bump type
        id: decide
        env:
          MSGS: ${{ steps.msgs.outputs.msgs }}
          PKG_CHANGED: ${{ steps.pkg.outputs.pkg_changed }}
        run: |
          set -euo pipefail

          BUMP="minor"
          REASON="no native dep change detected"

          if [ "${FORCE_MAJOR:-false}" = "true" ]; then
            BUMP="major"
            REASON="FORCE_MAJOR=true set on the repo"
          fi

          # The iOS first-deploy marker is gone for the same reason as the
          # Android one in playstore.yml: it lived on one machine's disk, and a
          # hosted runner has no such disk. See that file for the full note.

          if [ "$PKG_CHANGED" = "true" ]; then
            BUMP="major"
            REASON="native dependencies or configuration changed in apps/customer-app"
          fi
          if echo "$MSGS" | grep -Eqi '^(feat|breaking)(\(.+\))?!?:'; then
            BUMP="major"
            REASON="commit prefix is feat: or BREAKING"
          fi

          echo "Decision: $BUMP ($REASON)"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "$MSGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── 3. Cloud build + App Store submit (major bumps only). ─────────────────
  build-submit:
    name: Build / Submit (EAS cloud)
    runs-on: ubuntu-latest
    needs: detect-bump
    if: needs.detect-bump.outputs.bump == 'major'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install app deps
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas whoami

      - name: Materialize App Store Connect API key
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ASC_API_KEY_P8" ]; then
            echo "APPLE_ASC_API_KEY_P8 secret is empty" >&2
            exit 1
          fi
          printf '%s' "$APPLE_ASC_API_KEY_P8" > /tmp/asc-api-key.p8

      # The build itself runs on EAS macOS infrastructure. Credentials
      # (distribution cert, provisioning profile) are managed remotely, so no
      # Apple secrets are needed to build — only the API key for the submit.
      #
      # --auto-submit --no-wait: EAS uploads to App Store Connect itself once
      # the build finishes, so this runner exits as soon as the build is
      # queued instead of sitting idle for the whole EAS queue + build (10–84
      # min a run, all of it billed as Actions minutes once the repo is
      # private). The submission is created right here, before the CLI
      # returns, and the CLI reads the .p8 at that moment and sends its
      # contents along — so the cleanup step below deleting it is fine. Build
      # or submit failures now show up on expo.dev and in Expo's email, not as
      # a red run here.
      #
      # This uploads to App Store Connect only; it does NOT release to users.
      # Submitting for review and releasing stay manual in App Store Connect.
      #
      # The old "Persist the version EAS used" step is gone: it needed the
      # finished build, autoIncrement is off (app.json's buildNumber is what
      # ships), and its push to main was always rejected by branch protection.
      - name: Build iOS .ipa on EAS cloud and auto-submit to App Store Connect
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # ascAppId and appleTeamId live in eas.json (neither is secret).
          # Auth is via an App Store Connect API key rather than the Apple ID
          # + app-specific password — that pair is tied to a personal Apple ID
          # session and silently breaks (no revocation, just stops working)
          # independent of the password's own validity. The API key has no
          # such failure mode. EAS reads these three exact variable names —
          # renaming them silently breaks the upload.
          EXPO_ASC_API_KEY_PATH: /tmp/asc-api-key.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive \
            --auto-submit --no-wait

      - name: Clean up App Store Connect API key
        if: always()
        run: rm -f /tmp/asc-api-key.p8
