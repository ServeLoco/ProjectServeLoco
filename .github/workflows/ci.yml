name: API CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/api/**'
      # The backup round-trip below runs against this job's MySQL service
      # container, so a change to the verifier belongs in this workflow's
      # trigger too — ci-infra.yml watches deploy/** but has no database.
      - 'deploy/backup/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/api/**'
      - 'deploy/backup/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./apps/api

    # Spin up real MySQL + MongoDB so integration tests pass
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: serveloco_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './apps/api/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    # CI already provisions MySQL/Mongo service containers but, until now,
    # never actually ran the migration against them (every test mocks
    # src/db/mysql). Running it here — twice — is the only automated check
    # that migrate.js still boots cleanly and is still idempotent.
    # See plans/multi-area.md §6.1 / §9.3 (H9).
    - name: Run DB migration (first pass)
      run: npm run db:migrate
      env:
        NODE_ENV: development
        JWT_SECRET: ci_jwt_secret_that_is_long_enough
        ADMIN_OWNER_ID: ci_admin
        ADMIN_PASSWORD: ci_test_password_123
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_DATABASE: serveloco_test
        MYSQL_USER: root
        MYSQL_PASSWORD: test
        MYSQL_SSL: false
        MONGODB_URI: mongodb://localhost:27017/
        MONGODB_DATABASE: serveloco_images_test

    - name: Run DB migration (second pass — must be idempotent)
      run: npm run db:migrate
      env:
        NODE_ENV: development
        JWT_SECRET: ci_jwt_secret_that_is_long_enough
        ADMIN_OWNER_ID: ci_admin
        ADMIN_PASSWORD: ci_test_password_123
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_DATABASE: serveloco_test
        MYSQL_USER: root
        MYSQL_PASSWORD: test
        MYSQL_SSL: false
        MONGODB_URI: mongodb://localhost:27017/
        MONGODB_DATABASE: serveloco_images_test

    # The deploy takes a mysqldump before it migrates and treats it as the
    # rollback point. Nothing ever restored one. This dumps the database CI
    # just migrated, restores it into a scratch schema, and then breaks the
    # dump the three ways a real backup breaks to confirm each is caught —
    # so the day the verifier stops verifying is a red build, not a bad
    # restore. See plans/multi-area-tasks.md TASK 0.1.
    - name: Backup dump/restore round-trip
      working-directory: .
      run: ./deploy/backup/selftest.sh serveloco_test
      env:
        VERIFY_MYSQL_HOST: 127.0.0.1
        VERIFY_MYSQL_PORT: 3306
        VERIFY_MYSQL_USER: root
        VERIFY_MYSQL_PASSWORD: test
        # A freshly migrated database has the tables migrate.js seeds and no
        # customer data, so orders/users are legitimately empty here. The
        # production defaults in verify-restore.sh still require them.
        VERIFY_NONEMPTY_TABLES: areas admins categories products settings store_modes
        # A schema-only dump of this database is ~8.6 KB, under the 10 KB
        # floor that catches a mysqldump which died on the real data.
        VERIFY_MIN_DUMP_BYTES: 4096

    - name: Run Tests
      run: npm test
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_DATABASE: serveloco_test
        MYSQL_USER: root
        MYSQL_PASSWORD: test
        MYSQL_SSL: false
        MONGODB_URI: mongodb://localhost:27017/
        MONGODB_DATABASE: serveloco_images_test
