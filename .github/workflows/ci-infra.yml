name: Infra CI

# The app workflows are all scoped to apps/**, so changes to the compose
# files, the nginx routing config or the workflows themselves used to reach
# main with nothing having validated them — the first check was the deploy
# itself. This runs the cheap static checks on those files instead.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker-compose*.yml'
      - 'deploy/**'
      - 'apps/*/nginx.conf'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docker-compose*.yml'
      - 'deploy/**'
      - 'apps/*/nginx.conf'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compose files resolve
        run: |
          # apps/api/.env.production only exists on the production box; compose
          # refuses to parse the file without it.
          touch apps/api/.env.production
          # Same for the OTA server's secrets file.
          touch .env.ota
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml config >/dev/null
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml -f docker-compose.build.yml config >/dev/null
          rm apps/api/.env.production .env.ota

      - name: nginx configs are valid
        run: |
          for conf in deploy/nginx-proxy.conf apps/admin/nginx.conf apps/landing/nginx.conf; do
            echo "== $conf"
            docker run --rm -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
          done

      - name: Website redirects preserve compatibility routes
        run: |
          fixture_dir=$(mktemp -d)
          cleanup() {
            docker rm -f routing-proxy routing-landing routing-fixture >/dev/null 2>&1 || true
            docker network rm routing-ci >/dev/null 2>&1 || true
            rm -rf "$fixture_dir"
          }
          trap cleanup EXIT
          docker network create routing-ci
          docker build -t routing-landing apps/landing
          docker run -d --name routing-landing --network routing-ci --network-alias landing routing-landing
          cat > "$fixture_dir/default.conf" <<'NGINX'
          server {
              listen 80;
              listen 3000;
              return 200 "compatibility upstream $request_method $host$request_uri";
          }
          NGINX
          docker run -d --name routing-fixture --network routing-ci --network-alias api --network-alias admin --network-alias ota -v "$fixture_dir/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          cp deploy/nginx-proxy.conf "$fixture_dir/proxy.conf"
          start_proxy() {
            docker run -d --name routing-proxy --network routing-ci -p 127.0.0.1:8080:80 -v "$fixture_dir/proxy.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          }
          start_proxy
          python3 deploy/check-website-routing.py

          # Reproduce Git replacing a single-file mount: reload cannot see the
          # new inode. The deployment must detect this and recreate the proxy.
          cp "$fixture_dir/proxy.conf" "$fixture_dir/next.conf"
          echo '# replacement inode regression fixture' >> "$fixture_dir/next.conf"
          mv "$fixture_dir/next.conf" "$fixture_dir/proxy.conf"
          if docker exec routing-proxy cat /etc/nginx/conf.d/default.conf | cmp -s "$fixture_dir/proxy.conf" -; then
            echo 'Expected the existing single-file mount to retain the old inode'
            exit 1
          fi
          docker run --rm --network routing-ci -v "$fixture_dir/proxy.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
          docker rm -f routing-proxy
          start_proxy
          docker exec routing-proxy cat /etc/nginx/conf.d/default.conf | cmp -s "$fixture_dir/proxy.conf" -
          python3 deploy/check-website-routing.py
