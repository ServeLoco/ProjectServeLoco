name: Infra CI

# The app workflows are all scoped to apps/**, so changes to the compose
# files, the nginx routing config or the workflows themselves used to reach
# main with nothing having validated them — the first check was the deploy
# itself. This runs the cheap static checks on those files instead.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker-compose*.yml'
      - 'deploy/**'
      - 'apps/*/nginx.conf'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docker-compose*.yml'
      - 'deploy/**'
      - 'apps/*/nginx.conf'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compose files resolve
        run: |
          # apps/api/.env.production only exists on the production box; compose
          # refuses to parse the file without it.
          touch apps/api/.env.production
          # Same for the OTA server's secrets file.
          touch .env.ota
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml config >/dev/null
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml -f docker-compose.build.yml config >/dev/null
          rm apps/api/.env.production .env.ota

      - name: nginx configs are valid
        run: |
          for conf in deploy/nginx-proxy.conf apps/admin/nginx.conf apps/landing/nginx.conf; do
            echo "== $conf"
            docker run --rm -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
          done
