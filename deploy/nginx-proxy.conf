# Nginx router for the Docker Compose stack (runs INSIDE the `proxy` container).
# Routes each subdomain to the right container by its compose service name.
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.

# Docker's embedded DNS. Without this, nginx resolves each upstream name ONCE
# at startup and caches the container IP forever. Deploys now recreate single
# services (api) while the proxy keeps running, and a recreated container gets
# a new IP — the cached one would 502 until the proxy itself was restarted.
# Every proxy_pass below therefore goes through a variable, which forces nginx
# to re-resolve on the interval below.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── serveloco.app (apex) + www -> landing page container ───────────────
server {
    listen 80 default_server;
    server_name serveloco.app www.serveloco.app;

    location / {
        set $upstream_landing http://landing:80;
        proxy_pass $upstream_landing$request_uri;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── api.serveloco.app -> Node API container ─────────────────────────────
server {
    listen 80;
    server_name api.serveloco.app;

    client_max_body_size 12M;   # allow image uploads

    location / {
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for Socket.IO realtime orders
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 70s;
    }
}

# ── admin.serveloco.app -> admin static container ───────────────────────
server {
    listen 80;
    server_name admin.serveloco.app;

    location / {
        set $upstream_admin http://admin:80;
        proxy_pass $upstream_admin$request_uri;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ── ota.serveloco.app -> xprem OTA update server ───────────────────────
# Phones download app updates from here; CI publishes to it (eoas publish).

# Update files (/assets) are named by their content hash, so a URL never
# changes. xprem brotli-compresses each download on the fly — ~0.75 s and a
# lot of memory for the 4.5 MB bundle — and a broadcast makes ~30 phones ask
# for it in the same minute, which ran it past its 192 MB limit on every
# broadcast. With this cache it compresses each file once.
proxy_cache_path /var/cache/nginx/ota-assets levels=1:2 keys_zone=ota_assets:1m
                 max_size=200m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name ota.serveloco.app;

    # A publish uploads the JS bundle and every asset. Cloudflare's own
    # request cap (100 MB on the free plan) is the outer limit.
    client_max_body_size 50M;

    location = /assets {
        set $upstream_ota http://ota:3000;
        proxy_pass $upstream_ota$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache ota_assets;
        # xprem finds the file by the app id header, and the copy is
        # compressed for the Accept-Encoding it was asked with.
        proxy_cache_key "$request_uri|$http_expo_app_id|$http_accept_encoding";
        # Only successful downloads, whatever xprem's headers say (they are
        # still passed on to the phone).
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 30d;
        # The first request of a rush fetches the file; the rest wait for
        # it here instead of each going to xprem.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 120s;
    }

    location / {
        set $upstream_ota http://ota:3000;
        proxy_pass $upstream_ota$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
